<script>
'use strict';
const DATA=JSON.parse(document.getElementById('collection-data').textContent);
const state={category:null,tags:new Set(),authors:new Set(),query:'',sensitive:false};
const $=id=>document.getElementById(id);
const str=v=>v==null?'':String(v);
const arr=v=>Array.isArray(v)?v:[];
const norm=s=>str(s).toLocaleLowerCase('zh-Hant');
const escText=(el,value)=>{el.textContent=str(value)};
function countFor(predicate){return DATA.filter(predicate).length}
function makeTree(){const root=$('tree');root.replaceChildren();const all=document.createElement('button');all.type='button';all.className=state.category===null?'active':'';all.innerHTML='<span>全部分類</span><span class="count"></span>';all.querySelector('.count').textContent=DATA.length;all.onclick=()=>{state.category=null;render()};root.append(all);
 const map=new Map();for(const r of DATA){const main=str(r['主分類'])||'未分類',sub=str(r['子分類'])||'未分類';if(!map.has(main))map.set(main,new Map());map.get(main).set(sub,(map.get(main).get(sub)||0)+1)}
 for(const [main,subs] of [...map].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'))){const total=[...subs.values()].reduce((a,b)=>a+b,0);const parent=document.createElement('div');const b=document.createElement('button');b.type='button';b.className=state.category===main?'active':'';const label=document.createElement('span');label.textContent=main;const c=document.createElement('span');c.className='count';c.textContent=total;b.append(label,c);b.onclick=()=>{state.category=state.category===main?null:main;render()};parent.append(b);
 for(const [sub,n] of [...subs].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'))){const sb=document.createElement('button');sb.type='button';sb.className='sub'+(state.category===main+'\n'+sub?' active':'');const sl=document.createElement('span');sl.textContent='↳ '+sub;const sc=document.createElement('span');sc.className='count';sc.textContent=n;sb.append(sl,sc);sb.onclick=()=>{const key=main+'\n'+sub;state.category=state.category===key?null:key;render()};parent.append(sb)}root.append(parent)} }
function makeTags(){const box=$('tags');box.replaceChildren();const names=[...new Set(DATA.flatMap(r=>arr(r['標籤']).map(str)))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant'));for(const name of names){const label=document.createElement('label');label.className='chip';const input=document.createElement('input');input.type='checkbox';input.checked=state.tags.has(name);input.onchange=()=>{input.checked?state.tags.add(name):state.tags.delete(name);renderCards()};const text=document.createElement('span');text.textContent=name;label.append(input,text);box.append(label)}}
function makeAuthors(){const box=$('authors'),q=norm($('authorSearch').value);box.replaceChildren();const names=[...new Set(DATA.map(r=>str(r['作者帳號']).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));for(const name of names){if(q&&!norm(name).includes(q))continue;const label=document.createElement('label');label.className='author-option';const input=document.createElement('input');input.type='checkbox';input.checked=state.authors.has(name);input.onchange=()=>{input.checked?state.authors.add(name):state.authors.delete(name);renderCards()};const text=document.createElement('span');text.textContent=name;label.append(input,text);box.append(label)}}
function matches(r){if(r.sensitive===true&&!state.sensitive)return false;if(state.category){const [main,sub]=state.category.split('\n');if(str(r['主分類'])!==main||(sub&&str(r['子分類'])!==sub))return false}if(state.tags.size&&!arr(r['標籤']).some(x=>state.tags.has(str(x))))return false;if(state.authors.size&&!state.authors.has(str(r['作者帳號']).trim()))return false;if(state.query){const hay=[r['內容摘要'],...arr(r['關鍵字']),...arr(r['標籤'])].map(norm).join('\n');if(!hay.includes(state.query))return false}return true}
function renderCards(){const list=DATA.filter(matches);$('resultCount').replaceChildren();const strong=document.createElement('strong');strong.textContent=`顯示 ${list.length} 筆 / 共 ${DATA.length} 筆`;$('resultCount').append(strong);$('activeHint').textContent=(state.tags.size||state.authors.size||state.category||state.query)?'已套用篩選':'';$('warning').replaceChildren();if(state.sensitive){const w=document.createElement('div');w.className='warning';w.textContent='已開啟敏感內容：以下結果可能包含敏感項目。';$('warning').append(w)}const cards=$('cards');cards.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='沒有符合條件的收藏，試試調整篩選。';cards.append(empty);return}
 for(const r of list){const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='card-top';const left=document.createElement('div');const author=document.createElement('div');author.className='author';author.textContent=str(r['作者帳號'])||'未知作者';left.append(author);const cat=document.createElement('div');cat.className='category';cat.textContent=[r['主分類'],r['子分類']].filter(Boolean).join(' › ')||'未分類';left.append(cat);const date=document.createElement('time');date.className='date';date.textContent=str(r['發布日期']);date.dateTime=/^\d{4}-\d\d-\d\d$/.test(date.textContent)?date.textContent:'';top.append(left,date);card.append(top);if(r.sensitive===true){const w=document.createElement('div');w.className='warning';w.textContent='敏感內容';card.append(w)}const summary=document.createElement('p');summary.className='summary';summary.textContent=str(r['內容摘要']);card.append(summary);const tags=document.createElement('div');tags.className='tags';for(const t of [...arr(r['標籤']),...arr(r['關鍵字'])]){const pill=document.createElement('span');pill.className='tag';pill.textContent=str(t);tags.append(pill)}if(tags.childNodes.length)card.append(tags);const bottom=document.createElement('div');bottom.className='card-bottom';const href=str(r['原文連結']);if(/^https:\/\//i.test(href)){const a=document.createElement('a');a.className='original';a.href=href;a.rel='noopener';a.textContent='查看原文 ↗';bottom.append(a)}if(bottom.childNodes.length)card.append(bottom);cards.append(card)}}
function render(){makeTree();makeTags();makeAuthors();renderCards()}
$('query').addEventListener('input',e=>{state.query=norm(e.target.value.trim());renderCards()});$('authorSearch').addEventListener('input',makeAuthors);$('sensitive').addEventListener('change',e=>{state.sensitive=e.target.checked;renderCards()});$('clear').onclick=()=>{state.category=null;state.tags.clear();state.authors.clear();state.query='';state.sensitive=false;$('query').value='';$('sensitive').checked=false;$('authorSearch').value='';render()};$('filterToggle').onclick=()=>{const open=$('filters').classList.toggle('open');$('filterToggle').setAttribute('aria-expanded',String(open))};render();
</script>
</body>
</html>
